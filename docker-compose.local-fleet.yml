# Local Fleet — 8 bots moved from server to local machine on 2026-06-13.
# These are the lowest-CAGR strategies (server keeps the top 8).
#
# Each bot runs with its own SQLite (no bridge sync to trad_pg).
# Container names prefixed with `local_` to distinguish from server copies.
#
# Start:  docker compose -f docker-compose.local-fleet.yml up -d
# Stop:   docker compose -f docker-compose.local-fleet.yml down

services:

  # ============ #97 AI Shield V1 ============
  local_ai_shield:
    image: freqtradeorg/freqtrade:2026.4
    container_name: local_ai_shield
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./config.ai_shield.json:/freqtrade/config.json:ro
    command: >
      trade --logfile /freqtrade/user_data/logs/local_ai_shield.log
      --db-url sqlite:////freqtrade/user_data/tradesv3_local_ai_shield.sqlite
      --config /freqtrade/config.json --strategy BtcAiShieldStrategy

  # ============ #98 Triple Regime BTC ============
  local_triple_btc:
    image: freqtradeorg/freqtrade:2026.4
    container_name: local_triple_btc
    restart: unless-stopped
    environment:
      TR_MODE: "TR_STRICT"
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./config.triple.json:/freqtrade/config.json:ro
    command: >
      trade --logfile /freqtrade/user_data/logs/local_triple_btc.log
      --db-url sqlite:////freqtrade/user_data/tradesv3_local_triple_btc.sqlite
      --config /freqtrade/config.json --strategy BtcTripleRegimeStrategy

